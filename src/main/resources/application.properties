spring.application.name=auth-server
# Cambiar el puerto para que no choque con el backend de clínicas (que seguro usa 8080)
server.port=8081

# Configuración de conexión a tu base de datos MySQL (crea una BD llamada authsecurity)
spring.datasource.url=jdbc:mysql://localhost:3306/authsecurity?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate: para que Spring cree las tablas automáticamente en la base de datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true