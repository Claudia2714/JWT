# ═══════════════════════════════════════════════════════════════════════════════
# AUTH-SERVER — Configuración
# Variables de entorno para producción; valores por defecto para desarrollo local
# ═══════════════════════════════════════════════════════════════════════════════

# ── Puerto del servidor ──────────────────────────────────────────────────────
# En producción, plataformas como Render/Railway inyectan PORT automáticamente
server.port=${PORT:8080}

# ── Base de Datos PostgreSQL (Neon) ──────────────────────────────────────────
# URL CON POOLER → para las consultas de la aplicación en ejecución (rápido, escalable)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-flat-brook-b5vu8mll-pooler.c-7.us-east-2.aws.neon.tech/neondb?user=neondb_owner&password=npg_z8x3kNHyoPiq&sslmode=require&channelBinding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_z8x3kNHyoPiq}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Hibernate / JPA ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# "update" → Hibernate agrega columnas nuevas sin borrar las existentes.
# IMPORTANTE: para que los ALTER TABLE (DDL) funcionen en Neon, Hibernate
# necesita conectarse al endpoint DIRECTO (sin -pooler), que acepta DDL.
# El pooler en modo transaccional rechaza comandos ALTER TABLE.
spring.jpa.hibernate.ddl-auto=update

# URL DIRECTA → solo para DDL al arrancar (sin pooler, puerto 5432)
# Esta línea hace que Hibernate use la conexión directa para crear/alterar tablas
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=none
spring.datasource.hikari.connection-init-sql=SET statement_timeout = 30000

# ── CORS ─────────────────────────────────────────────────────────────────────
# En desarrollo: http://localhost:4200
# En producción: tu URL de Netlify/Vercel, ej: https://clinica.netlify.app
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}

# ── Cloudflare Turnstile ──────────────────────────────────────────────────────
# Obtén el Secret Key en: https://dash.cloudflare.com → Turnstile → tu sitio
# NUNCA hardcodees esta clave aquí. Usa siempre la variable de entorno en producción.
turnstile.secret-key=${TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}
# Nota: el valor por defecto (1x000...AA) es la clave de prueba de Cloudflare
# que SIEMPRE valida como exitosa — úsala solo en desarrollo local.